<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>JUMPY 교사 화면</title><link rel="stylesheet" href="style.css"></head><body class="teacher-app"><main class="teacher-shell"><header class="app-header"><div class="wordmark">JUMPY<span>.</span> <small style="font-size:14px;letter-spacing:0;color:#717987">교사</small></div><a href="./" class="text-button">학생 화면</a></header>
<section id="teacherLogin" class="teacher-login"><span class="eyebrow">TEACHER SPACE</span><h1>선생님 로그인</h1><p class="subtle">교사 PIN으로 수업 화면에 들어갑니다.</p><label for="teacherPin">교사 PIN</label><input id="teacherPin" type="password" autocomplete="off" placeholder="PIN 입력"><label for="teacherUrl">시트 연결 주소</label><input id="teacherUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec"><button id="teacherEnter" class="primary wide">로그인</button><p id="loginStatus" class="error" role="alert"></p></section>
<section id="teacherContent" class="hidden"><div class="teacher-board"><aside class="teacher-sidebar"><h2>수업 선택</h2><label for="tGrade">학년</label><input id="tGrade" type="number" min="1" max="6" value="2"><label for="tClass">반</label><input id="tClass" type="number" min="1" max="30" value="3"><button id="loadClass" class="primary">반 불러오기</button><button id="copyStudentLink" class="secondary">학생용 링크 복사</button><button id="teacherLogout" class="secondary">로그아웃</button><p id="teacherStatus" class="status-line" role="status"></p></aside><div class="teacher-main"><section><div class="teacher-top"><div><span class="eyebrow">LIVE CLASS</span><h1 id="classTitle">2학년 3반</h1><p class="subtle">기록과 음악 줄넘기 제출 현황</p></div><div class="teacher-toolbar"><button id="refreshClass" class="secondary">새로고침</button><button id="toggleProjector" class="secondary">프로젝터 화면</button></div></div><div class="projector-stats"><div><span>기록 참여</span><strong id="participantCount">0명</strong></div><div><span>최고 기록</span><strong id="classBest">—</strong></div><div><span>음악 제출</span><strong id="musicCount">0조</strong></div></div></section><section><h2>우리 반 순위</h2><table class="teacher-table"><thead><tr><th>순위</th><th>번호</th><th>반영 기록</th><th>도전 횟수</th></tr></thead><tbody id="classRanking"></tbody></table></section><section><h2>음악 줄넘기 제출</h2><table class="teacher-table"><thead><tr><th>조 이름</th><th>주제</th><th>4박자 동작</th><th>제출자</th></tr></thead><tbody id="musicSubmissions"></tbody></table></section><section id="settingsCard"><h2>반별 활동 설정</h2><div class="teacher-settings"><label><span>제한시간(초)</span><input id="duration" type="number" min="5" max="600"></label><label><span>준비 카운트다운(초)</span><input id="countdownSetting" type="number" min="0" max="15"></label><label><span>민감도</span><select id="sensitivity"><option>낮음</option><option>보통</option><option>높음</option></select></label><label><span>재도전 횟수</span><input id="retryLimit" type="number" min="0" max="20"></label><label><span>반영 기록</span><select id="recordMode"><option value="best">최고기록</option><option value="latest">마지막 기록</option></select></label><div><label class="check"><input id="retryAllowed" type="checkbox"> 재도전 허용</label><label class="check"><input id="rankingVisible" type="checkbox"> 순위 공개</label><label class="check"><input id="activityOpen" type="checkbox"> 활동 열기</label></div></div><button id="saveSettings" class="primary">설정 저장</button><p id="saveStatus" class="status-line" role="status"></p></section></div></div></section>
</main><script type="module" src="teacher.js"></script></body></html>
