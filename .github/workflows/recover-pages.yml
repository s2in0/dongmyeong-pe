name: Clear stalled Pages publish
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-pages.yml']
permissions:
  contents: read
  pages: write
  actions: write
jobs:
  cancel-stalled-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only the stalled settings-update deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/38594228031/force-cancel"
          sleep 5
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/38594228031" --jq '.status + " / " + (.conclusion // "")'
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/deployments/4cfff2a487cde16879f6633d57bb6134fd04fdd8/cancel"
          gh api "repos/$GITHUB_REPOSITORY/pages/deployments/4cfff2a487cde16879f6633d57bb6134fd04fdd8"
